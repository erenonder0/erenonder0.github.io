baseURL = "https://erenonder.com/"
title = "Eren ONDER"
locale = "en"
enableRobotsTXT = true
timeZone = "Europe/Istanbul"
disableHugoGeneratorInject = true

# Taxonomy pages are not linked from anywhere; tags stay available as .Params.tags.
disableKinds = ["taxonomy", "term"]

[pagination]
disableAliases = true

[markup.goldmark.renderer]
unsafe = true

[outputs]
  home = ["HTML"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

# Content that only feeds the homepage is kept in page collections but never
# published on its own URL. See CLAUDE.md → "Unpublished content".
[[cascade]]
  [cascade.build]
    render = "never"
    list = "never"
  [cascade.target]
    path = "/home"

[[cascade]]
  [cascade.build]
    render = "never"
  [cascade.target]
    path = "{/home/**,/experience,/experience/**,/activity,/activity/**,/volunteer-work,/volunteer-work/**,/education,/education/**}"

[module]
[[module.imports]]
path = "github.com/zetxek/adritian-free-hugo-theme"

  # Re-declared so the theme's unused static files (demo images, slick, shuffle,
  # extra fonts, .htaccess) are not published. Only these are referenced.
  [[module.imports.mounts]]
  source = "assets"
  target = "assets"
  [[module.imports.mounts]]
  source = "data"
  target = "data"
  [[module.imports.mounts]]
  source = "i18n"
  target = "i18n"
  [[module.imports.mounts]]
  source = "layouts"
  target = "layouts"
  [[module.imports.mounts]]
  source = "static"
  target = "static"
  files = [
    "fonts/adritian-icons.*",
    "js/library/lozad.min.js",
    "js/library/smooth-scroll.polyfills.min.js",
    "js/copy-code.js",
    "js/rad-animations.js",
    "js/sticky-header.js",
  ]

[[module.mounts]]
source = "assets"
target = "assets"

[[module.mounts]]
source = "i18n"
target = "i18n"

[[module.mounts]]
source = "layouts"
target = "layouts"

[[module.mounts]]
source = "static"
target = "static"

[[module.mounts]]
source = "data"
target = "data"

[[module.mounts]]
source = "node_modules/bootstrap/scss"
target = "assets/scss/bootstrap"

[[module.mounts]]
source = "node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"
target = "assets/js/vendor/bootstrap.bundle.min.js"

[[module.mounts]]
source = "node_modules/bootstrap-print-css/css/bootstrap-print.css"
target = "assets/css/bootstrap-print.css"


[params]
title = 'Eren ONDER | Cyber Security & Digital Forensics Portfolio'
description = 'Junior Cyber Security Specialist. SIEM-based threat detection, incident response and SOAR automation on critical infrastructure — projects and technical write-ups.'
images = ['/img/og-img.png']
themeColor = '#080c14'
homepageExperienceCount = 6
viewTransitions = false
lightbox = false

# GA4 is emitted by layouts/partials/head_custom.html; the theme's own tag stays
# disabled (see CLAUDE.md → "Analytics").
[params.analytics.googleAnalytics]
code = "G-22M0WEP24K"
enabled = false

[params.blog]
listStyle = "summary"
readingProgress = false  # the site has its own scroll progress bar

[params.colorTheme.auto]
disable = true
[params.colorTheme.forced]
theme = "dark"
[params.colorTheme.selector.disable]
footer = true
header = true
mobileHeader = true

[[params.plugins.css]]
URL = "css/custom.css"
[[params.plugins.css]]
URL = "css/adritian-icons.css"
[[params.plugins.css]]
URL = "css/bootstrap-print.css"

[[params.plugins.scss]]
URL = "scss/adritian.scss"


