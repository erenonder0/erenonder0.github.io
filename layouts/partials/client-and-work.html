{{/* Homepage projects section — overrides theme client-and-work.html */}}
{{ $sectionId := .Get "sectionId" | default "projects" }}

<section id="{{ $sectionId }}" class="cyber-section section--border-bottom">
  <div class="container">
    <div class="cyber-section__head reveal">
      <span class="cyber-section__eyebrow">{{ i18n "projects_eyebrow" }}</span>
      <h2 class="cyber-section__title">{{ .Get "title" | default (i18n "client_work_title") }}</h2>
    </div>

    {{ partial "project-cards.html" (where site.RegularPages "Type" "projects") }}
  </div>
</section>
