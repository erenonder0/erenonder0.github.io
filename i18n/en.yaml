## About
- id: "about_bio"
  translation: "<p>I'm Eren ONDER, a Junior Cyber Security Specialist working on critical national infrastructure. I cover the full SOC workflow on Splunk and IBM QRadar — from alert triage through SOAR automation — alongside incident response, malware analysis and email security.</p><p>I graduated in Digital Forensic Engineering with a 3.64 GPA and have peer-reviewed research published on machine-learning-based threat detection. I build AI-assisted tooling that cuts the analysis and triage load on SOC teams, and stay active in the community as a CTF competitor and instructor.</p>"

