## About
- id: "about_bio"
  translation: "<p>Ben Eren ONDER, kritik ulusal altyapıda görev yapan bir Siber Güvenlik Uzman Yardımcısıyım. Splunk ve IBM QRadar üzerinde alarm triyajından SOAR otomasyonuna kadar uçtan uca SOC süreçlerinde yer alıyor; olay müdahale, zararlı yazılım analizi ve e-posta güvenliği üzerine çalışıyorum.</p><p>Adli Bilişim Mühendisliği lisansını 3.64 ortalamayla tamamladım; makine öğrenmesi tabanlı tehdit tespiti alanında hakemli yayınım bulunuyor. SOC ekiplerinin analiz ve triyaj yükünü azaltan yapay zekâ destekli araçlar geliştiriyor, CTF yarışmacısı ve eğitmen olarak topluluğa katkı sağlamayı sürdürüyorum.</p>"

